# Local stand-in for the 32-node fleet in demo.md, scaled down to 4 worker
# nodes + 1 control-plane so it fits on a smaller laptop. Each "node" below
# is a real Docker container acting as one physical machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # extraPortMappings expose Elasticsearch and Kibana straight on
  # localhost, instead of needing `kubectl port-forward` after every
  # up.sh run. The container ports here (30920/30561) must match the
  # NodePort values set in k8s/eck/elasticsearch.yaml and kibana.yaml -
  # kind can only map a host port to a fixed container port, and
  # NodePort is the only Service type that binds to a fixed port on
  # every node.
  - role: control-plane
    extraPortMappings:
      - containerPort: 30920
        hostPort: 9200
        protocol: TCP
      - containerPort: 30561
        hostPort: 5601
        protocol: TCP

  # node-index labels let the fake-node generator (sim/fake-node) know
  # which of the 4 simulated physical nodes it is running on.
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=gpu-worker,node-index=1"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=gpu-worker,node-index=2"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=gpu-worker,node-index=3"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=gpu-worker,node-index=4"
