# Kibana as a UI only, for browsing what the fake fleet ships into
# Elasticsearch (Discover / Dashboards). No alert rules here on purpose -
# Kibana Alerting is the next planning stage (demo.md section 4.2),
# once these fake logs/metrics are proven realistic enough to alert on.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: gpu-sim-kibana
  namespace: gpu-sim
spec:
  version: 8.15.0
  count: 1
  elasticsearchRef:
    name: gpu-sim-es
  # NodePort (fixed at 30561) instead of the default ClusterIP, so kind's
  # extraPortMappings (kind-cluster.yaml) can map it straight through to
  # localhost:5601 - no port-forward needed after up.sh.
  http:
    service:
      spec:
        type: NodePort
        # Same requirement as elasticsearch.yaml: keep the "https" port
        # name ECK expects, don't just override port/nodePort.
        ports:
          - name: https
            port: 5601
            nodePort: 30561
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 1Gi
              cpu: "0.3"
            limits:
              memory: 1Gi
