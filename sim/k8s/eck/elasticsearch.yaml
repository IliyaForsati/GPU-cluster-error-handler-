# 3-node Elasticsearch, matching demo.md section 4.1 (the correlation
# store for both logs and hardware metrics). One nodeSet, count 3, so
# all 3 pods do both master and data duty - fine for a local simulation,
# a real deployment would split master/data/ingest roles.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: gpu-sim-es
  namespace: gpu-sim
spec:
  version: 8.15.0
  # NodePort (fixed at 30920) instead of the default ClusterIP, so kind's
  # extraPortMappings (kind-cluster.yaml) can map it straight through to
  # localhost:9200 - no port-forward needed after up.sh.
  http:
    service:
      spec:
        type: NodePort
        # name: https is required - ECK's own Kibana<->Elasticsearch
        # wiring looks up this service's port *by that name*
        # ("no port named [https] in service..." if it's missing), not
        # just by number.
        ports:
          - name: https
            port: 9200
            nodePort: 30920
  nodeSets:
    - name: default
      count: 3
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 2Gi
                  cpu: "0.5"
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
