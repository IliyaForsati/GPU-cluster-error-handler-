# One pod per gpu-worker node (8 total), each simulating one physical
# machine from demo.md: a generator container faking 8 H200 GPUs, and
# a Fluent Bit sidecar shipping its logs/metrics to Elasticsearch -
# mirroring the real per-node telemetry DaemonSet in demo.md section 3.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fake-node
  namespace: gpu-sim
  labels:
    app: fake-node
spec:
  selector:
    matchLabels:
      app: fake-node
  template:
    metadata:
      labels:
        app: fake-node
    spec:
      # Only schedule on the 8 nodes standing in for GPU workers, not
      # on the kind control-plane node.
      nodeSelector:
        node-role: gpu-worker
      containers:
        - name: generator
          image: fake-node-generator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GPU_COUNT
              value: "8"
            - name: FAULT_RATE
              value: "0.03"
            - name: LOG_FILE
              value: /var/log/fake-node/generator.log
          ports:
            - containerPort: 9400
              name: metrics
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/fake-node
          resources:
            requests:
              memory: 128Mi
              cpu: "0.1"
            limits:
              memory: 256Mi

        - name: fluent-bit
          image: fluent/fluent-bit:3.1
          env:
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gpu-sim-es-es-elastic-user
                  key: elastic
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/fake-node
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc
          resources:
            requests:
              memory: 64Mi
              cpu: "0.05"
            limits:
              memory: 128Mi
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
